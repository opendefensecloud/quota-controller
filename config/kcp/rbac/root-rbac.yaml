# kcp RBAC for the quota-controller — ROOT workspace.
#
# Apply with a privileged identity:
#
#   envsubst < config/kcp/rbac/root-rbac.yaml | kubectl --context root apply -f -
#
# Placeholders:
#   ${CONTROLLER_IDENTITY} -> the controller's kcp user,
#                             e.g. system:serviceaccount:quota-system:quota-controller
#
# kcp presents the components across the front-proxy as the virtual user
# "system:serviceaccount:<namespace>:<name>", so every binding here uses a User
# subject. A ServiceAccount subject only resolves inside its own logical cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quota-controller
rules:
  # Enter child workspaces through virtual workspace endpoints.
  - apiGroups: ["core.kcp.io"]
    resources: ["workspaces/content"]
    verbs: ["access"]
  # Read Workspace objects to resolve workspace paths to logical cluster names.
  - apiGroups: ["tenancy.kcp.io"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quota-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quota-controller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${CONTROLLER_IDENTITY}
