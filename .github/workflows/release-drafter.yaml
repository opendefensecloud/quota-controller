name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # There is deliberately no pull_request trigger. Since v7 the root action only
  # drafts releases and no longer autolabels, so a PR run would do nothing but
  # re-create the draft release — which fails outright on PRs from forks, where
  # GitHub forces GITHUB_TOKEN to read-only regardless of the permissions below.
  # Changelog categories are driven by labels applied by hand.
  update_release_draft:
    permissions:
      contents: write # write permission is required to create a github release
      # Reading merged pull requests only works implicitly while the repo is
      # public; grant it so the drafter keeps working if that ever changes.
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "main"
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          commitish: main
